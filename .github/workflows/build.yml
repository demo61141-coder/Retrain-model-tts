name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle ভার্সন: আপনার প্রজেক্টের AGP-এর সাথে মিলতে হবে। বর্তমান AI Studio টেমপ্লেটে 9.3.1 চলে।
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # SDK ভার্সন: আপনার অ্যাপের app/build.gradle.kts-এ compileSdk যা, এখানে সেই নম্বর বসান (এখন 36)।
      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # debug.keystore: AI Studio টেমপ্লেটের debugConfig এটা চায়। অন্য অ্যাপে না লাগলে থাকলেও ক্ষতি নেই।
      - name: Ensure debug.keystore and sherpa-onnx AAR exist
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # sherpa: শুধু sherpa ব্যবহার করা অ্যাপের জন্য। আপনার অ্যাপে sherpa না থাকলে এই অংশটা বাদ দিতে পারেন (থাকলেও ক্ষতি নেই, শুধু একটু সময় বেশি লাগবে)।
          mkdir -p app/libs
          if [ ! -s app/libs/sherpa-onnx-2.0.1.aar ]; then
            curl -L -o app/libs/sherpa-onnx-2.0.1.aar \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          fi

      # প্রজেক্টে gradlew থাকলে নিচের লাইনটা ./gradlew assembleDebug --stacktrace করুন।
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
